name: CI–FastAPI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  security:
    name: Security check
    runs-on: ubuntu-24.04
    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Installer safety
      - name: Install safety
        run: |
          python -m pip install --upgrade pip
          pip install "safety==2.3.5"
      # Scanner les dépendances à la recherche de vulnérabilités connues
      - name: Run safety check
        run: |
          safety check -r requirements-dev.txt --full-report
  test:
    needs: security
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Installer les dépendances dev
      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip list
      # Tests unitaires / async
      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
           pytest --cov=app --cov-report=term-missing --maxfail=1 --disable-warnings -q
